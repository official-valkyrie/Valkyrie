name: Clippy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: clippy (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        features: [default, release, debug]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy --all-targets ${{ matrix.features != 'default' && format('--features valkyrie/{0}', matrix.features) || '' }} -- -D warnings
