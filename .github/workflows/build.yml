name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: meta
    if: github.event.action != 'edited' || github.event.changes.body
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read a MAJOR.MINOR.PATCH version from Cargo.toml (got '$version')"
            exit 1
          fi

          tags=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          highest=$(printf '%s\n%s\n' "$tags" "$version" | sort -V | tail -n 1)
          if [ "$highest" != "$version" ]; then
            echo "::error::Version $version in Cargo.toml is lower than latest release $highest"
            exit 1
          fi

          release=false
          if ! grep -qx "$version" <<< "$tags"; then
            if [ "${{ github.event_name }}" = push ]; then
              release=true
            else
              echo "::notice::Merging this PR will create a draft release $version"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }}, ${{ matrix.target }})
    needs: meta
    if: github.event.action != 'edited' || github.event.changes.body
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target: [v2, v3-nopext, v3, v4]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - if: runner.os == 'Windows'
        run: command -v make || choco install make -y --no-progress

      - run: |
          if [ "${{ needs.meta.outputs.release }}" = true ]; then
            make release-${{ matrix.target }}
          else
            make ${{ matrix.target }} FEATURES=prerelease
            ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
            name=$(./valkyrie$ext version | tail -n 1 | tr -d '\r' | tr A-Z a-z)
            platform=$(tr A-Z a-z <<< "$RUNNER_OS")
            mkdir -p "releases/$name"
            mv "valkyrie$ext" "releases/$name/$name-$platform-x86-64-${{ matrix.target }}$ext"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.target }}
          path: releases

  bench:
    name: bench (${{ matrix.os }}, ${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target: [v2, v3-nopext, v3, v4]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.target }}
          path: releases

      - run: |
          if [ "${{ matrix.target }}" = v4 ] && ! grep -qw avx512f /proc/cpuinfo; then
            echo "::notice::Runner has no AVX-512, skipping v4 bench"
            exit 0
          fi
          chmod +x releases/*/*
          releases/*/* bench | tee bench.txt
          mkdir bench
          sed -n 's/^Bench: \([0-9]*\) nodes.*/\1/p' bench.txt > "bench/${{ matrix.os }}-${{ matrix.target }}"
          test -s "bench/${{ matrix.os }}-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-${{ matrix.target }}
          path: bench
          if-no-files-found: ignore

  node-count:
    name: node count
    needs: bench
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.nodes.outputs.nodes }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: bench
          merge-multiple: true

      - id: nodes
        run: |
          grep . bench/*
          if [ "$(sort -u bench/* | wc -l)" -ne 1 ]; then
            echo "::error::Bench node counts differ between builds"
            exit 1
          fi
          echo "nodes=$(sort -u bench/*)" >> "$GITHUB_OUTPUT"

  bench-correctness:
    name: bench correctness
    needs: node-count
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
      NODES: ${{ needs.node-count.outputs.nodes }}
    steps:
      - run: |
          body=$(gh api "$PR" --jq '.body // ""' | tr -d '\r')
          last=$(printf '%s\n' "$body" | grep -v '^[[:space:]]*$' | tail -n 1 || true)
          if [[ $last =~ ^Bench:\ *([0-9]+)[[:space:]]*$ ]]; then
            if [ "${BASH_REMATCH[1]}" != "$NODES" ]; then
              echo "::error title=Incorrect bench::PR description says Bench: ${BASH_REMATCH[1]}, bench gives $NODES"
              exit 1
            fi
          else
            if [ -n "$body" ]; then
              printf '%s\n\nBench: %s\n' "$body" "$NODES" > body.md
            else
              printf 'Bench: %s\n' "$NODES" > body.md
            fi
            gh api -X PATCH "$PR" -F body=@body.md > /dev/null ||
              echo "::warning::Could not add Bench: $NODES to the PR description"
          fi

  prerelease:
    name: prerelease
    needs: [meta, node-count]
    if: github.event_name == 'push' && needs.meta.outputs.release != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - run: |
          repo="${{ github.repository }}"
          name=$(ls dist)

          latest=$(git tag | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$latest" ]; then
            range="$latest..HEAD"
            heading="Commits since $latest"
          else
            range=HEAD
            heading="Commits"
          fi

          {
            echo '> [!WARNING]'
            echo '> This is an automatic prerelease built from the latest commit on `main`. It is **not an official release** and may have stability issues.'
            echo '>'
            echo "> For a stable build, use the [latest official release](https://github.com/$repo/releases/latest)."
            echo
            echo "## $heading"
            echo
            git log "$range" --abbrev=8 --format="- [\`%h\`](https://github.com/$repo/commit/%H) %s"
          } > notes.md

          if gh release view prerelease --repo "$repo" > /dev/null 2>&1; then
            gh release delete prerelease --repo "$repo" --yes
          fi
          if gh api "repos/$repo/git/ref/tags/prerelease" > /dev/null 2>&1; then
            gh api -X DELETE "repos/$repo/git/refs/tags/prerelease"
          fi

          gh release create prerelease dist/"$name"/* \
            --repo "$repo" \
            --target "${{ github.sha }}" \
            --title "Valkyrie ${name#valkyrie-}" \
            --notes-file notes.md \
            --prerelease

          tag_sha=$(gh api "repos/$repo/git/ref/tags/prerelease" --jq .object.sha)
          if [ "$tag_sha" != "${{ github.sha }}" ]; then
            echo "::error::prerelease tag points to $tag_sha, expected ${{ github.sha }}"
            exit 1
          fi

  release:
    name: release
    needs: [meta, node-count]
    if: github.event_name == 'push' && needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - run: |
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"

          if gh api "repos/$repo/git/ref/tags/$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

          : > notes.md
          pr=$(gh api "repos/$repo/commits/$sha/pulls" --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh api "repos/$repo/pulls/$pr" --jq '.body // ""' |
              tr -d '\r' |
              { grep -v -E '^Bench: *[0-9]+[[:space:]]*$' || true; } |
              awk '{ l[NR] = $0 } END { n = NR; while (n > 0 && l[n] ~ /^[[:space:]]*$/) n--; for (i = 1; i <= n; i++) print l[i] }' > notes.md
          fi

          notes=(--generate-notes)
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          fi

          for id in $(gh api "repos/$repo/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$VERSION\") | .id"); do
            gh api -X DELETE "repos/$repo/releases/$id"
          done

          gh release create "$VERSION" dist/*/* \
            --repo "$repo" \
            --target "$sha" \
            --title "Valkyrie $VERSION" \
            --draft \
            "${notes[@]}"

          draft_target=$(gh api "repos/$repo/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$VERSION\") | .target_commitish")
          if [ "$draft_target" != "$sha" ]; then
            echo "::error::Draft $VERSION targets '$draft_target', expected $sha"
            exit 1
          fi

          if gh release view prerelease --repo "$repo" > /dev/null 2>&1; then
            gh release delete prerelease --repo "$repo" --yes
          fi
          if gh api "repos/$repo/git/ref/tags/prerelease" > /dev/null 2>&1; then
            gh api -X DELETE "repos/$repo/git/refs/tags/prerelease"
          fi
